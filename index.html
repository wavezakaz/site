<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Пульс Заказов</title>
  
  <!-- PWA настройки -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12181f">
  
  <!-- Иконка приложения -->
  <link rel="icon" type="image/png" href="./favicon.png?v=3">
  <link rel="apple-touch-icon" href="./favicon.png?v=3">

  <!-- Настройки для iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Пульс Заказов">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #12181f;
      color: #e1e6ed;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-y: auto;
    }

    /* PWA-баннер */
    .pwa-banner {
      display: none;
      width: 100%;
      max-width: 600px;
      background-color: #1a2430;
      border: 1px solid #00a2ff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(0, 162, 255, 0.2);
    }

    .pwa-banner-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .pwa-text {
      font-size: 13px;
      color: #ffffff;
      line-height: 1.3;
    }

    .pwa-text strong {
      color: #00a2ff;
      display: block;
      margin-bottom: 2px;
    }

    .pwa-btn {
      background-color: #00a2ff;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .pwa-close {
      background: none;
      border: none;
      color: #8b9bb4;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background-color: #1e2630;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid #2a3544;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }

    .header h2 {
      font-size: 22px;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      color: #8b9bb4;
    }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #141b22;
      border: 1px solid #2c3847;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #00a2ff;
      font-weight: 600;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid #3a4859;
      color: #8b9bb4;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      border-color: #ff4d4d;
      color: #ff4d4d;
    }

    /* Переключение вкладок */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid #2a3544;
      padding-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #141b22;
      border: 1px solid #2c3847;
      border-radius: 8px;
      color: #8b9bb4;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tab-btn.active {
      background: #00a2ff;
      color: #ffffff;
      border-color: #00a2ff;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #8b9bb4;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      font-size: 16px;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #2c3847;
      background-color: #141b22;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    input[disabled] {
      background-color: #1a232d;
      color: #7d8c9e;
      cursor: not-allowed;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      border-color: #00a2ff;
    }

    textarea {
      resize: vertical;
      min-height: 180px;
      line-height: 1.4;
    }

    .file-drop-zone {
      position: relative;
      border: 2px dashed #2c3847;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background-color: #141b22;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .file-drop-zone:hover {
      border-color: #00a2ff;
      background-color: #18222c;
    }

    .file-drop-zone input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-label-text {
      font-size: 14px;
      color: #8b9bb4;
      word-break: break-all;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      background-color: #00a2ff;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    .btn-submit:active {
      background-color: #0082cc;
    }

    .btn-submit:disabled {
      background-color: #3a4859;
      color: #7d8c9e;
      cursor: not-allowed;
    }

    /* Карточки заказов */
    .order-card {
      background-color: #141b22;
      border: 1px solid #2c3847;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #8b9bb4;
      margin-bottom: 8px;
    }

    .order-title {
      font-size: 14px;
      color: #ffffff;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .badge-new { background-color: #1e3a5f; color: #60a5fa; border: 1px solid #2563eb; }
    .badge-work { background-color: #4a3b00; color: #fbbf24; border: 1px solid #d97706; }
    .badge-done { background-color: #064e3b; color: #34d399; border: 1px solid #059669; }

    /* Сообщения об ошибках / успехе */
    .alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .alert-error { background-color: #3d1a1d; border: 1px solid #f87171; color: #fca5a5; }
    .alert-success { background-color: #133e2b; border: 1px solid #34d399; color: #a7f3d0; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Баннер PWA установки -->
  <div id="pwaBanner" class="pwa-banner">
    <div class="pwa-banner-content">
      <div class="pwa-text" id="pwaText">
        <strong>Установить приложение</strong>
        Добавьте форму на главный экран
      </div>
      <button id="pwaBtn" class="pwa-btn">Установить</button>
      <button onclick="closePwaBanner()" class="pwa-close">✕</button>
    </div>
  </div>

  <div class="card">
    <div class="header">
      <h2>Пульс Заказов</h2>
      <p>Панель управления и подачи заявок</p>
    </div>

    <!-- ЭКРАН 1: Авторизация -->
    <div id="login-screen">
      <div id="login-alert" class="alert alert-error"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="pin">Введите PIN-код доступа</label>
          <input type="password" id="pin" placeholder="****" inputmode="numeric" required autocomplete="off">
        </div>
        <button type="submit" class="btn-submit" id="login-btn">Войти</button>
      </form>
    </div>

    <!-- ЭКРАН 2: Главный интерфейс -->
    <div id="app-screen" class="hidden">
      <div class="user-bar">
        <span id="user-display">Пользователь</span>
        <button class="logout-btn" onclick="logout()">Выйти</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-btn-create" onclick="switchTab('create')">Новая заявка</button>
        <button class="tab-btn" id="tab-btn-orders" onclick="switchTab('orders')">Мои заказы</button>
      </div>

      <div id="app-alert" class="alert"></div>

      <!-- Вкладка: Подача заявки -->
      <div id="tab-create">
        <form id="orderForm">
          <div class="form-group">
            <label for="customer">Заказчик</label>
            <input type="text" id="customer" name="customer" disabled>
          </div>

          <div class="form-group">
            <label for="title">Наименование и описание</label>
            <textarea id="title" name="title" placeholder="Укажите позицию, количество или описание..." required></textarea>
          </div>

          <div class="form-group">
            <label>Прикрепить файл / фото (необязательно)</label>
            <div class="file-drop-zone">
              <span class="file-label-text" id="fileNameDisplay">📂 Нажмите или перетащите файл</span>
              <input type="file" id="fileInput" onchange="updateFileName(this)">
            </div>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">Отправить заявку</button>
        </form>
      </div>

      <!-- Вкладка: Список заказов -->
      <div id="tab-orders" class="hidden">
        <div id="orders-list">
          <p style="text-align: center; color: #8b9bb4; font-size: 14px; padding: 20px 0;">Загрузка списка заказов...</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGodIh5zW-XpkdFWvQanDEOG0k9GTES-C0of-1p_JJraKQTHMDADXjti4d15bwJdww/exec";

    let currentUser = localStorage.getItem("app_user") || null;

    // --- PWA Логика ---
    let deferredPrompt;
    const pwaBanner = document.getElementById('pwaBanner');
    const pwaBtn = document.getElementById('pwaBtn');
    const pwaText = document.getElementById('pwaText');

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
    }

    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    if (!isStandalone) {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        pwaBanner.style.display = 'block';
      });

      const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIos) {
        pwaText.innerHTML = '<strong>Установить приложение</strong>Нажмите «Поделиться» ⎋ и выберите «На экран "Домой"»';
        pwaBtn.style.display = 'none';
        pwaBanner.style.display = 'block';
      }
    }

    pwaBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          pwaBanner.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    function closePwaBanner() {
      pwaBanner.style.display = 'none';
    }

    // --- Инициализация авторизации ---
    window.addEventListener('DOMContentLoaded', () => {
      if (currentUser) {
        showApp();
      } else {
        showLogin();
      }
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pin = document.getElementById("pin").value.trim();
      const btn = document.getElementById("login-btn");
      
      btn.disabled = true;
      btn.innerText = "ПРОВЕРКА...";
      hideAlert("login-alert");

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "login", pin: pin })
        });
        const data = await response.json();

        if (data.success) {
          currentUser = data.customer;
          localStorage.setItem("app_user", currentUser);
          showApp();
        } else {
          showAlert("login-alert", data.message || "Неверный PIN-код", "error");
        }
      } catch (err) {
        showAlert("login-alert", "Ошибка соединения с сервером", "error");
      } finally {
        btn.disabled = false;
        btn.innerText = "ВОЙТИ";
      }
    });

    function logout() {
      localStorage.removeItem("app_user");
      currentUser = null;
      document.getElementById("pin").value = "";
      showLogin();
    }

    function showLogin() {
      document.getElementById("login-screen").classList.remove("hidden");
      document.getElementById("app-screen").classList.add("hidden");
    }

    function showApp() {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("app-screen").classList.remove("hidden");
      document.getElementById("user-display").innerText = "👤 " + currentUser;
      document.getElementById("customer").value = currentUser;
      switchTab('create');
    }

    function switchTab(tabName) {
      const btnCreate = document.getElementById("tab-btn-create");
      const btnOrders = document.getElementById("tab-btn-orders");

      btnCreate.classList.toggle("active", tabName === 'create');
      btnOrders.classList.toggle("active", tabName === 'orders');

      document.getElementById("tab-create").classList.toggle("hidden", tabName !== 'create');
      document.getElementById("tab-orders").classList.toggle("hidden", tabName !== 'orders');

      hideAlert("app-alert");

      if (tabName === 'orders') {
        loadOrders();
      }
    }

    // Имя файла
    function updateFileName(input) {
      const display = document.getElementById('fileNameDisplay');
      if (input.files && input.files[0]) {
        display.innerText = "📄 " + input.files[0].name;
        display.style.color = "#00a2ff";
      } else {
        display.innerText = "📂 Нажмите или перетащите файл";
        display.style.color = "#8b9bb4";
      }
    }

    // --- Отправка формы заявки ---
    document.getElementById('orderForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const title = document.getElementById('title').value.trim();
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!title) return;

      btn.disabled = true;
      btn.innerText = "ОТПРАВКА...";
      hideAlert("app-alert");

      let fileData = null;
      let fileName = null;

      if (file) {
        fileName = file.name;
        fileData = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
      }

      const payload = {
        customer: currentUser,
        title: title,
        fileName: fileName,
        fileData: fileData
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (data.result === "success" || data.success) {
          showAlert("app-alert", "Заявка успешно отправлена!", "success");
          document.getElementById('title').value = "";
          fileInput.value = "";
          updateFileName(fileInput);
        } else {
          showAlert("app-alert", "Ошибка: " + (data.error || "Не удалось сохранить"), "error");
        }
      } catch (err) {
        showAlert("app-alert", "Ошибка при отправке заявки", "error");
      } finally {
        btn.disabled = false;
        btn.innerText = "ОТПРАВИТЬ ЗАЯВКУ";
      }
    });

    // --- Загрузка заказов ---
    async function loadOrders() {
      const listContainer = document.getElementById("orders-list");
      listContainer.innerHTML = '<p style="text-align: center; color: #8b9bb4; font-size: 14px; padding: 20px 0;">Загрузка списка заказов...</p>';

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getOrders", customer: currentUser })
        });
        const data = await response.json();

        if (data.success && data.orders.length > 0) {
          listContainer.innerHTML = data.orders.map(order => {
            let badgeClass = "badge-new";
            const st = (order.status || "").toLowerCase();
            if (st.includes("раб")) badgeClass = "badge-work";
            if (st.includes("гот") || st.includes("завр") || st.includes("вып")) badgeClass = "badge-done";

            return `
              <div class="order-card">
                <div class="order-header">
                  <span>📅 ${order.date}</span>
                  <span class="badge ${badgeClass}">${order.status}</span>
                </div>
                <div class="order-title">${escapeHtml(order.title)}</div>
              </div>
            `;
          }).join("");
        } else {
          listContainer.innerHTML = '<p style="text-align: center; color: #8b9bb4; font-size: 14px; padding: 20px 0;">У вас пока нет отправленных заявок</p>';
        }
      } catch (err) {
        listContainer.innerHTML = '<p style="text-align: center; color: #f87171; font-size: 14px; padding: 20px 0;">Ошибка загрузки списка заказов</p>';
      }
    }

    // Вспомогательные функции
    function showAlert(elementId, text, type) {
      const el = document.getElementById(elementId);
      el.className = `alert alert-${type === 'error' ? 'error' : 'success'}`;
      el.innerText = text;
      el.style.display = "block";
    }

    function hideAlert(elementId) {
      document.getElementById(elementId).style.display = "none";
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
