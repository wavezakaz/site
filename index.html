<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Пульс Заказов</title>

  <!-- PWA настройки -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12181f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Заказы">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #12181f;
      color: #e1e6ed;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-y: auto;
    }

    /* Стили для PWA-баннера установки */
    .pwa-banner {
      display: none;
      width: 100%;
      max-width: 600px;
      background-color: #1a2430;
      border: 1px solid #00a2ff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(0, 162, 255, 0.2);
    }

    .pwa-banner-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .pwa-text {
      font-size: 13px;
      color: #ffffff;
      line-height: 1.3;
    }

    .pwa-text strong {
      color: #00a2ff;
      display: block;
      margin-bottom: 2px;
    }

    .pwa-btn {
      background-color: #00a2ff;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .pwa-close {
      background: none;
      border: none;
      color: #8b9bb4;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background-color: #1e2630;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid #2a3544;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h2 {
      font-size: 22px;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      color: #8b9bb4;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #8b9bb4;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      font-size: 16px; /* Оптимально для мобильных, убирает автозум в Safari */
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #2c3847;
      background-color: #141b22;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: #00a2ff;
    }

    textarea {
      resize: vertical;
      min-height: 220px; /* Умеренно высокое поле под описание */
      line-height: 1.4;
    }

    .file-drop-zone {
      position: relative;
      border: 2px dashed #2c3847;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background-color: #141b22;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .file-drop-zone:hover {
      border-color: #00a2ff;
      background-color: #18222c;
    }

    .file-drop-zone input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-label-text {
      font-size: 14px;
      color: #8b9bb4;
      word-break: break-all;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      background-color: #00a2ff;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    .btn-submit:active {
      background-color: #0082cc;
    }

    .btn-submit:disabled {
      background-color: #3a4859;
      color: #7d8c9e;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Баннер PWA установки -->
  <div id="pwaBanner" class="pwa-banner">
    <div class="pwa-banner-content">
      <div class="pwa-text" id="pwaText">
        <strong>Установить приложение</strong>
        Добавьте форму на главный экран
      </div>
      <button id="pwaBtn" class="pwa-btn">Установить</button>
      <button onclick="closePwaBanner()" class="pwa-close">✕</button>
    </div>
  </div>

  <div class="card">
    <div class="header">
      <h2>Пульс Заказов</h2>
      <p>Форма оперативной подачи заявки</p>
    </div>

    <form id="orderForm">
      <div class="form-group">
        <label for="customer">Заказчик / Отдел</label>
        <input type="text" id="customer" name="customer" placeholder="Например: СКЛАД" required>
      </div>

      <div class="form-group">
        <label for="title">Наименование и описание</label>
        <textarea id="title" name="title" placeholder="Укажите позицию, количество или описание..." required></textarea>
      </div>

      <div class="form-group">
        <label>Прикрепить файл / фото (необязательно)</label>
        <div class="file-drop-zone">
          <span class="file-label-text" id="fileNameDisplay">📂 Нажмите или перетащите файл</span>
          <input type="file" id="fileInput" onchange="updateFileName(this)">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Отправить заявку</button>
    </form>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQhzyKhE4jAIbLOATPQykPKZ-_qPoY8S16759xVIuUD0gLHz6CWMi9KgVyV57X-adq/exec";

    // --- PWA Логика ---
    let deferredPrompt;
    const pwaBanner = document.getElementById('pwaBanner');
    const pwaBtn = document.getElementById('pwaBtn');
    const pwaText = document.getElementById('pwaText');

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
    }

    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    if (!isStandalone) {
      // Android / Chrome
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        pwaBanner.style.display = 'block';
      });

      // iOS / Safari
      const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIos) {
        pwaText.innerHTML = '<strong>Установить приложение</strong>Нажмите «Поделиться» ⎋ и выберите «На экран "Домой"»';
        pwaBtn.style.display = 'none';
        pwaBanner.style.display = 'block';
      }
    }

    pwaBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          pwaBanner.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    function closePwaBanner() {
      pwaBanner.style.display = 'none';
    }

    // --- Автозаполнение полей из URL-параметров (из QR-кода) ---
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      
      if (urlParams.has('customer')) {
        document.getElementById('customer').value = urlParams.get('customer');
      }
      if (urlParams.has('title')) {
        document.getElementById('title').value = urlParams.get('title');
      }
    });

    // Отображение имени выбранного файла
    function updateFileName(input) {
      const display = document.getElementById('fileNameDisplay');
      if (input.files && input.files[0]) {
        display.innerText = "📄 " + input.files[0].name;
        display.style.color = "#00a2ff";
      } else {
        display.innerText = "📂 Нажмите или перетащите файл";
        display.style.color = "#8b9bb4";
      }
    }

    // Обработка отправки формы
    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Отправка...";

      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      const sendData = (fileData = null, fileName = null) => {
        const payload = {
          customer: document.getElementById('customer').value,
          title: document.getElementById('title').value,
          fileName: fileName,
          fileData: fileData
        };

        fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          alert('Заявка успешно отправлена!');
          document.getElementById('orderForm').reset();
          updateFileName(fileInput);
        })
        .catch(err => {
          alert('Ошибка при отправке заявки');
        })
        .finally(() => {
          btn.disabled = false;
          btn.innerText = "Отправить заявку";
        });
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          sendData(evt.target.result, file.name);
        };
        reader.readAsDataURL(file);
      } else {
        sendData();
      }
    });
  </script>
</body>
</html>
